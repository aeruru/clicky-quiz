<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clicky Quiz</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">FFXIV Mechanics Practice</p>
        <h1 id="page-title">Hello, Clicky Quiz!</h1>
        <p>
          This tiny client-side web app will become a place to practice simple
          Final Fantasy XIV mechanics quizzes.
        </p>
        <button id="hello-button" type="button">Click me</button>
        <p id="message" class="message" aria-live="polite"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
