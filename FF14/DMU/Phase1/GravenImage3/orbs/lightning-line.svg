<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 96" role="img" aria-labelledby="title desc">
  <title id="title">Lightning line</title>
  <desc id="desc">A blue-white jagged lightning line with electric glow.</desc>
  <defs>
    <linearGradient id="lightning-core" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7dfdff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#f7ffff"/>
      <stop offset="0.36" stop-color="#9dfbff"/>
      <stop offset="0.64" stop-color="#ffffff"/>
      <stop offset="0.88" stop-color="#7bd9ff"/>
      <stop offset="1" stop-color="#51b6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lightning-aura" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4738ff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#4a55ff" stop-opacity="0.9"/>
      <stop offset="0.52" stop-color="#25e4ff"/>
      <stop offset="0.83" stop-color="#7f63ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4738ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lightning-glow" x="-14%" y="-120%" width="128%" height="340%">
      <feGaussianBlur stdDeviation="6.5" result="wide"/>
      <feColorMatrix
        in="wide"
        type="matrix"
        values="0 0 0 0 0.18 0 0 0 0 0.74 0 0 0 0 1 0 0 0 0.9 0"
        result="blue"
      />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="tight"/>
      <feMerge>
        <feMergeNode in="blue"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#lightning-glow)">
    <polyline
      points="12,62 58,55 93,61 124,50 158,58 195,45 233,54 268,42 306,52 342,39 381,47 420,36 500,41"
      stroke="url(#lightning-aura)"
      stroke-width="20"
      opacity="0.6"
    />
    <polyline
      points="12,62 58,55 93,61 124,50 158,58 195,45 233,54 268,42 306,52 342,39 381,47 420,36 500,41"
      stroke="url(#lightning-core)"
      stroke-width="7"
    />
    <polyline
      points="14,62 57,55 91,60 123,50 158,58 196,45 233,54 269,42 306,52 343,39 381,47 420,36 498,41"
      stroke="#ffffff"
      stroke-width="2.6"
      opacity="0.95"
    />
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#lightning-glow)">
    <path d="M94 61 76 78m49-28 13-23m96 27-19 21m54-33 15-22m59 19-12 25m89-28 18-18" stroke="#f8ffff" stroke-width="3.4"/>
    <path d="M94 61 63 76m181-23-29-7m163 1-20-15m55 7-24 18" stroke="#8ff7ff" stroke-width="5" opacity="0.55"/>
  </g>
  <g fill="#ffffff">
    <circle cx="58" cy="55" r="2.8"/>
    <circle cx="195" cy="45" r="3.2"/>
    <circle cx="342" cy="39" r="3"/>
    <circle cx="420" cy="36" r="2.6"/>
  </g>
  <g fill="#8cfbff" opacity="0.72">
    <circle cx="31" cy="65" r="1.8"/>
    <circle cx="146" cy="57" r="1.5"/>
    <circle cx="296" cy="52" r="1.8"/>
    <circle cx="470" cy="40" r="1.6"/>
  </g>
</svg>
