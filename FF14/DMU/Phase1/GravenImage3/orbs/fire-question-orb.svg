<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Fire question orb</title>
  <desc id="desc">A red fire orb with a golden glowing question mark.</desc>
  <defs>
    <radialGradient id="orb-fill" cx="43%" cy="35%" r="62%">
      <stop offset="0" stop-color="#ffb45c"/>
      <stop offset="0.2" stop-color="#e73b21"/>
      <stop offset="0.48" stop-color="#8b1118"/>
      <stop offset="0.78" stop-color="#3b0710"/>
      <stop offset="1" stop-color="#180208"/>
    </radialGradient>
    <radialGradient id="hot-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#ff9b1f" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ff5c1c" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#ffcf5b" stop-opacity="0.88"/>
    </radialGradient>
    <linearGradient id="question-fill" x1="44" x2="86" y1="24" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4a8"/>
      <stop offset="0.42" stop-color="#ffc936"/>
      <stop offset="0.78" stop-color="#ff7a20"/>
      <stop offset="1" stop-color="#ffe77d"/>
    </linearGradient>
    <filter id="fire-glow" x="-35%" y="-35%" width="170%" height="170%">
