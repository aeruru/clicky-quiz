<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Thunder orb</title>
  <desc id="desc">A dark blue magical orb with a bright lightning core.</desc>
  <defs>
    <radialGradient id="orb-fill" cx="45%" cy="40%" r="58%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.12" stop-color="#91f8ff"/>
      <stop offset="0.26" stop-color="#1c8fde"/>
      <stop offset="0.56" stop-color="#102b71"/>
      <stop offset="0.82" stop-color="#07143b"/>
      <stop offset="1" stop-color="#020513"/>
    </radialGradient>
    <radialGradient id="rim-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#25d8ff" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#20c8ff" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#0b7fd8" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="soft-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.05 0 0 0 0 0.72 0 0 0 0 1 0 0 0 0.85 0"
        result="glow"
      />
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="core-bloom" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="50" fill="#0b214d" opacity="0.5" filter="url(#soft-glow)"/>
  <circle cx="64" cy="64" r="48" fill="url(#orb-fill)"/>
  <circle cx="64" cy="64" r="48" fill="url(#rim-glow)"/>
  <path
    d="M56 18c-14 7-24 22-25 39-1 25 18 47 43 49 9 1 18-1 25-5-8 9-21 16-37 15-29-1-53-25-52-55C11 31 35 8 64 9c12 0 23 4 32 11-12-6-27-7-40-2Z"
    fill="#9af6ff"
    opacity="0.12"
  />
  <path
    d="M41 35c10 4 16 11 19 22m23-24c-12 7-17 15-17 28m35 3c-15-2-25 1-32 9M35 82c14-9 25-11 36-6"
    fill="none"
    stroke="#9df5ff"
    stroke-linecap="round"
    stroke-width="3"
    opacity="0.45"
  />
  <path
    d="M75 15 58 53l17-4-23 62 8-44-18 5 21-57Z"
    fill="#ffffff"
    filter="url(#core-bloom)"
  />
  <path
    d="M75 15 58 53l17-4-23 62 8-44-18 5 21-57Z"
    fill="#c7fbff"
    stroke="#ffffff"
    stroke-linejoin="round"
    stroke-width="2"
  />
  <path
    d="M88 20c5 3 10 7 15 13m-6 2 14 2-9 10m-74 3-9-7 12-4m9 54-13 1 8-10"
    fill="none"
    stroke="#ff765c"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="4"
    opacity="0.85"
  />
  <g fill="#e54870" opacity="0.82">
    <circle cx="23" cy="53" r="2.5"/>
    <circle cx="27" cy="70" r="2.2"/>
    <circle cx="35" cy="87" r="2.5"/>
    <circle cx="20" cy="83" r="1.8"/>
    <circle cx="31" cy="38" r="1.8"/>
  </g>
  <circle cx="51" cy="52" r="7" fill="#ff5e9b" opacity="0.86"/>
  <circle cx="51" cy="52" r="3.8" fill="#ffffff"/>
  <ellipse cx="50" cy="32" rx="18" ry="8" fill="#ffffff" opacity="0.16" transform="rotate(-22 50 32)"/>
