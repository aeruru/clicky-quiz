<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Spread ring marker</title>
  <desc id="desc">A cream circular marker with four outward chevrons.</desc>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.96 0 0 0 0 0.88 0 0 0 0 0.72 0 0 0 0.75 0"
        result="glow"
      />
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g
    fill="none"
    stroke="#eadfc3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#soft-glow)"
  >
    <circle cx="64" cy="64" r="43" stroke-width="3.5"/>
    <path d="M48 16 64 31 80 16" stroke-width="6.5"/>
    <path d="M48 16 64 44 80 16" stroke-width="6.5"/>
    <path d="M112 48 97 64 112 80" stroke-width="6.5"/>
    <path d="M112 48 84 64 112 80" stroke-width="6.5"/>
    <path d="M80 112 64 97 48 112" stroke-width="6.5"/>
    <path d="M80 112 64 84 48 112" stroke-width="6.5"/>
    <path d="M16 80 31 64 16 48" stroke-width="6.5"/>
    <path d="M16 80 44 64 16 48" stroke-width="6.5"/>
  </g>
</svg>
