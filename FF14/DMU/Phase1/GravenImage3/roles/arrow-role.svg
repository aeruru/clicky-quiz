<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Arrow role icon</title>
  <desc id="desc">A red square role icon with a beige arrow.</desc>
  <defs>
    <linearGradient id="tile" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9a4543"/>
      <stop offset="1" stop-color="#5b2527"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0d6"/>
      <stop offset="1" stop-color="#d8b48e"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="3" dy="3" stdDeviation="1.2" flood-color="#1a0d0c" flood-opacity="0.72"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="72" height="72" rx="10" fill="url(#tile)"/>
  <path
    d="M25 21 68 52 53 57 66 73 58 79 46 62 36 73Z"
    fill="url(#arrow)"
    stroke="#3b201b"
    stroke-linejoin="round"
    stroke-width="3"
    filter="url(#shadow)"
  />
  <path
    d="M33 30 60 50 49 53"
    fill="none"
    stroke="#fff8e8"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="3"
    opacity="0.75"
  />
</svg>
