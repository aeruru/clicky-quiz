<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Shield role icon</title>
  <desc id="desc">A square role icon with a blue shield.</desc>
  <defs>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8d88c"/>
      <stop offset="0.5" stop-color="#69643b"/>
      <stop offset="1" stop-color="#191814"/>
    </linearGradient>
    <linearGradient id="field" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#24416f"/>
      <stop offset="0.58" stop-color="#152339"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9efff"/>
      <stop offset="0.28" stop-color="#69a7ff"/>
      <stop offset="0.7" stop-color="#2d57c8"/>
      <stop offset="1" stop-color="#152875"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="80" height="80" rx="12" fill="#101216"/>
  <rect x="12" y="12" width="72" height="72" rx="9" fill="url(#frame)"/>
  <rect x="18" y="18" width="60" height="60" rx="6" fill="url(#field)"/>
  <path
    d="M48 20c9 8 20 11 29 11-1 22-9 36-29 47-20-11-28-25-29-47 9 0 20-3 29-11Z"
    fill="url(#shield)"
    stroke="#ecf8ff"
    stroke-linejoin="round"
    stroke-width="4"
    filter="url(#glow)"
  />
  <path d="M48 28c7 5 14 8 22 8-1 15-7 26-22 34Z" fill="#ffffff" opacity="0.28"/>
  <path d="M30 39c7 0 13-2 18-6v37C36 62 31 53 30 39Z" fill="#8dc4ff" opacity="0.28"/>
</svg>
