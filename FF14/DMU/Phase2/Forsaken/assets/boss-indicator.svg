<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Boss indicator</title>
  <desc id="desc">A beige targeting ring around a faerie marker.</desc>
  <defs>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path
    d="M40 12a68 68 0 1 0 80 0"
    fill="none"
    stroke="#d9ccad"
    stroke-linecap="butt"
    stroke-width="5"
  />
  <path d="M74 145h12l-6 9z" fill="#d9ccad"/>

  <text
    x="80"
    y="80"
    dominant-baseline="middle"
    fill="#ffffff"
    filter="url(#soft-shadow)"
    font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif"
    font-size="70"
    text-anchor="middle"
  >🧚‍♂️</text>
</svg>
