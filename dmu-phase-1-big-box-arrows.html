<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DMU Phase 1 Big Box Arrows | Aerry Berry's Clicky Quizzes</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="quiz-page">
    <main class="quiz-shell" aria-labelledby="page-title">
      <aside class="control-panel" aria-label="Quiz controls">
        <div>
          <p class="eyebrow">First Quiz</p>
          <h1 id="page-title">DMU Phase 1 Big Box Arrows</h1>
        </div>
        <div class="button-stack">
          <button type="button">Start</button>
          <button type="button">Reset</button>
          <button type="button">Check Answer</button>
        </div>
        <a class="back-link" href="index.html">Back to quizzes</a>
      </aside>

      <section class="arena-card" aria-label="Arena marker layout">
        <div class="arena-stage">
          <img
            class="arena-image"
            src="img/DMU/p1-arena.png"
            alt="DMU phase 1 circular arena"
          >
          <div class="box-target box-target-1" aria-hidden="true"></div>
          <div class="box-target box-target-2" aria-hidden="true"></div>
          <div class="box-target box-target-3" aria-hidden="true"></div>
          <div class="box-target box-target-4" aria-hidden="true"></div>
          <div class="box-target box-target-5" aria-hidden="true"></div>
          <div class="box-target box-target-6" aria-hidden="true"></div>
          <div class="box-target box-target-7" aria-hidden="true"></div>
          <div class="box-target box-target-8" aria-hidden="true"></div>
          <div class="box-target box-target-9" aria-hidden="true"></div>
          <div class="box-target box-target-10" aria-hidden="true"></div>
          <div class="box-target box-target-11" aria-hidden="true"></div>
          <div class="box-target box-target-12" aria-hidden="true"></div>
          <div class="box-target box-target-13" aria-hidden="true"></div>
          <div class="box-target box-target-14" aria-hidden="true"></div>
          <div class="box-target box-target-15" aria-hidden="true"></div>
          <div class="box-target box-target-16" aria-hidden="true"></div>
          <div class="marker marker-a" aria-label="Marker A">A</div>
          <div class="marker marker-b" aria-label="Marker B">B</div>
          <div class="marker marker-c" aria-label="Marker C">C</div>
          <div class="marker marker-d" aria-label="Marker D">D</div>
          <div class="marker marker-1" aria-label="Marker 1">1</div>
          <div class="marker marker-2" aria-label="Marker 2">2</div>
          <div class="marker marker-3" aria-label="Marker 3">3</div>
          <div class="marker marker-4" aria-label="Marker 4">4</div>
        </div>
      </section>
    </main>
  </body>
</html>
